<!DOCTYPE html>
<html lang="tk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MUKAM_PROVOCATIVE</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #101114;
    color: white;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 650px;
    margin: auto;
    padding: 55px 20px;
}

/* BAŞLYK */

.logo {
    text-align: center;
    font-size: 43px;
    font-weight: 900;
    letter-spacing: 2px;
    margin-bottom: 50px;
}


/* SOSIAL MEDIA */

.social {
    display: flex;
    align-items: center;
    gap: 18px;

    text-decoration: none;
    color: white;

    padding: 20px;
    margin: 15px 0;

    border-radius: 18px;

    font-size: 20px;
    font-weight: bold;

    transition: 0.25s;
}

.social:hover {
    transform: scale(1.025);
}


/* IKON */

.icon {
    width: 48px;
    height: 48px;

    border-radius: 14px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 25px;
    font-weight: bold;
}


/* TELEGRAM */

.telegram {
    background: #172b38;
    border: 1px solid #229ED9;
}

.telegram .icon {
    background: #229ED9;
}


/* TIKTOK */

.tiktok {
    background: #161616;
    border: 1px solid #ffffff;
}

.tiktok .icon {
    background: #000;
    box-shadow:
        3px 3px 0 #25F4EE,
        -3px -3px 0 #FE2C55;
}


/* INSTAGRAM */

.instagram {
    background: linear-gradient(
        100deg,
        #833AB4,
        #E1306C,
        #FD1D1D,
        #FCAF45
    );
}

.instagram .icon {
    background: rgba(0,0,0,0.25);
}


/* YOUTUBE */

.youtube {
    background: #321719;
    border: 1px solid #FF0000;
}

.youtube .icon {
    background: #FF0000;
}


/* PLATFORM NAME */

.name {
    display: flex;
    flex-direction: column;
    gap: 5px;
}

.platform {
    font-size: 21px;
}

.username {
    font-size: 16px;
    color: #aeb7c0;
    font-weight: normal;
}


/* MOBIL */

@media (max-width: 600px) {

    .container {
        padding: 40px 18px;
    }

    .logo {
        font-size: 35px;
        margin-bottom: 40px;
    }

    .social {
        padding: 17px;
    }

    .icon {
        width: 45px;
        height: 45px;
        flex-shrink: 0;
    }

}

</style>
</head>


<body>

<div class="container">


    <!-- BAŞLYK -->

    <div class="logo">
        MUKAM_PROVOCATIVE
    </div>


    <!-- TELEGRAM -->

    <a
        class="social telegram"
        href="https://t.me/Mkm_provocative_01"
        target="_blank"
    >

        <div class="icon">
            ✈
        </div>

        <div class="name">

            <div class="platform">
                Telegram
            </div>

            <div class="username">
                t.me/Mkm_provocative_01
            </div>

        </div>

    </a>


    <!-- TIKTOK -->

    <a
        class="social tiktok"
        href="https://www.tiktok.com/@mukam_provocative_"
        target="_blank"
    >

        <div class="icon">
            ♪
        </div>

        <div class="name">

            <div class="platform">
                TikTok
            </div>

            <div class="username">
                @mukam_provocative_
            </div>

        </div>

    </a>


    <!-- INSTAGRAM -->

    <a
        class="social instagram"
        href="https://www.instagram.com/mukam_provocative"
        target="_blank"
    >

        <div class="icon">
            ◎
        </div>

        <div class="name">

            <div class="platform">
                Instagram
            </div>

            <div class="username">
                @mukam_provocative
            </div>

        </div>

    </a>


    <!-- YOUTUBE -->

    <a
        class="social youtube"
        href="https://www.youtube.com/@mukam_provocative"
        target="_blank"
    >

        <div class="icon">
            ▶
        </div>

        <div class="name">

            <div class="platform">
                YouTube
            </div>

            <div class="username">
                @mukam_provocative
            </div>

        </div>

    </a>


</div>

</body>
</html>
